server:
  port: 8081
  servlet:
    session:
      timeout: 3h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict

spring:
  application:
    name: test-recorder-back

  datasource:
    url: jdbc:sqlite:./data/test_recorder_scenario_db.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    mixed: true
